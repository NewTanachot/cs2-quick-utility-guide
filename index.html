<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="คู่มือ smoke CS2 แยกตามแมพ — ดู lineup จาก CS Tactics หรือ NXZ พร้อม timestamp"
    />
    <title>CS2 Quick Smoke Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Oswald:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/map-picker.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="#/" data-link>
        <span class="brand-mark">CS2</span>
        <span class="brand-text">Quick Smoke</span>
      </a>
      <div class="header-actions">
        <span id="cache-status" class="cache-status" hidden></span>
        <div class="creator-switch">
          <span id="creator-switch-label" class="creator-switch__label">วิดีโอโดย</span>
          <div
            id="creator-options"
            class="creator-switch__options"
            role="group"
            aria-labelledby="creator-switch-label"
          ></div>
          <a
            id="channel-link"
            class="channel-link"
            href="https://www.youtube.com/@CS2Tactics/videos"
            target="_blank"
            rel="noopener noreferrer"
            title="เปิดช่อง CS Tactics บน YouTube"
            aria-label="เปิดช่อง CS Tactics บน YouTube"
          >
            YouTube ↗
          </a>
        </div>
      </div>
    </header>

    <main id="app" class="app" tabindex="-1"></main>

    <footer class="site-footer">
      <p>
        คลิปและ lineup จาก
        <a href="https://www.youtube.com/@CS2Tactics" target="_blank" rel="noopener noreferrer"
          >@CS2Tactics</a
        >
        และ
        <a href="https://www.youtube.com/@nxznxznxz" target="_blank" rel="noopener noreferrer"
          >@nxznxznxz</a
        >
        — ไม่ได้เชื่อมต่ออย่างเป็นทางการกับทั้งสองช่อง
      </p>
    </footer>

    <script src="js/app.js" type="module"></script>
  </body>
</html>
